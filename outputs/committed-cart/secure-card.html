<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercatus · Visa</title><link rel="icon" href="/assets/favicon.svg"><link rel="icon" href="/assets/favicon.ico" sizes="any"><link rel="stylesheet" href="/secure-card.css"></head><body><header><span class="wordmark">mercatus<span>.</span></span><strong class="visa">VISA</strong></header><form id="billing"><h1>Billing details</h1><div class="billing-grid">
<label>First name<input name="firstName" autocomplete="given-name" required></label><label>Last name<input name="lastName" autocomplete="family-name" required></label>
<label class="full">Email<input name="email" type="email" autocomplete="email" required></label>
<label class="full">Address<input name="address1" autocomplete="billing street-address" required></label>
<label>City<input name="locality" autocomplete="billing address-level2" required></label><label>State / region<input name="administrativeArea" autocomplete="billing address-level1" required></label>
<label>Postal code<input name="postalCode" autocomplete="billing postal-code" required></label><label>Country code<input name="country" placeholder="US" minlength="2" maxlength="2" pattern="[A-Za-z]{2}" autocomplete="billing country" required></label>
</div><button class="primary" type="submit">Continue to card →</button></form><main id="payment" hidden><h1>Confirm your wait</h1><button id="editBilling" class="quiet" type="button">Edit billing details</button><div class="hold-summary"><span>Maximum test hold</span><strong id="holdAmount">—</strong></div><label for="cardNumber">Card number</label><div id="cardNumber" class="hosted-field"></div><div class="fields-row"><div class="field"><label for="expMonth">Month</label><input id="expMonth" placeholder="MM" maxlength="2" inputmode="numeric" autocomplete="off"></div><div class="field"><label for="expYear">Year</label><input id="expYear" placeholder="YYYY" maxlength="4" inputmode="numeric" autocomplete="off"></div><div class="field"><label for="cardCvv">CVV</label><div id="cardCvv" class="hosted-field"></div></div></div><button id="loadCard" class="quiet">Connect card entry</button><p id="cardStatus" role="status"></p><button class="primary" id="useCard">Authorize test hold</button><p id="cardError" role="alert"></p></main><section id="success" class="success" hidden><div class="success-mark" aria-hidden="true">✓</div><h1>Your wait has started.</h1><p>Open Mercatus to see merchant offers.</p><button id="closeWindow" class="primary">Done</button></section><script>window.laterCardFlow=new URLSearchParams(location.hash.slice(1)).get("flow");if(window.laterCardFlow)document.body.classList.add("embedded");</script><script src="/card-entry.js"></script><script>
if(window.laterCardFlow){
 for(const [id,placeholder,max]of [['cardNumber','Visa sandbox card',23],['cardCvv','CVV',3]]){const input=document.createElement('input');input.id=id;input.placeholder=placeholder;input.inputMode='numeric';input.autocomplete='off';input.maxLength=max;document.getElementById(id).replaceWith(input);}
 document.getElementById('loadCard').hidden=true;
 window.tokenizeCard=async()=>({number:document.getElementById('cardNumber').value.replace(/\s/g,''),expirationMonth:document.getElementById('expMonth').value.padStart(2,'0'),expirationYear:document.getElementById('expYear').value,securityCode:document.getElementById('cardCvv').value});
}
let billTo=null;
document.getElementById('billing').onsubmit=event=>{event.preventDefault();billTo=Object.fromEntries(new FormData(event.currentTarget));billTo.country=billTo.country.toUpperCase();document.getElementById('billing').hidden=true;document.getElementById('payment').hidden=false;document.getElementById('loadCard').click();};
document.getElementById('editBilling').onclick=()=>{document.getElementById('billing').hidden=false;document.getElementById('payment').hidden=true;};
let commitDraft=null;try{if(location.hash.startsWith('#commit=')){commitDraft=JSON.parse(decodeURIComponent(location.hash.slice(8)));history.replaceState(null,'',location.pathname);const total=commitDraft.items.reduce((sum,x)=>sum+Number(x.price)*Number(x.quantity),0);document.getElementById('holdAmount').textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(total);}}catch{document.getElementById('cardError').textContent='Could not load the cart. Close this window and retry from Mercatus.';}
const extensionOrigin=new URLSearchParams(location.search).get('parent')==='web'?location.origin:'chrome-extension://kahjaomahjnhcppboeagnjclfbnjgjje';
const flowHeaders=()=>({'Content-Type':'application/json',...(window.laterCardFlow?{'X-Later-Card-Flow':window.laterCardFlow}:{})});
function report(status){if(window.laterCardFlow&&parent!==window)parent.postMessage({type:'later-card-result',flow:window.laterCardFlow,status},extensionOrigin);}
if(window.laterCardFlow)fetch('/api/card-flow-info',{method:'POST',headers:flowHeaders(),body:'{}'}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error);document.getElementById('holdAmount').textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(data.amount/100);}).catch(e=>{document.getElementById('cardError').textContent=e.message;document.getElementById('useCard').disabled=true;});
document.getElementById('closeWindow').onclick=()=>window.close();
document.getElementById('useCard').onclick=async()=>{const button=document.getElementById('useCard');button.disabled=true;document.getElementById('cardError').textContent='';try{const token=await window.tokenizeCard();if(commitDraft||window.laterCardFlow){const response=await fetch(window.laterCardFlow?'/api/commit-card':'/api/commit',{method:'POST',headers:flowHeaders(),body:JSON.stringify({...commitDraft,...(window.laterCardFlow?{card:token}:{cardToken:token}),billTo})});const data=await response.json();if(!response.ok)throw new Error(data.error);report(data.cart.status);if(data.cart.verification?.active){document.getElementById('payment').hidden=true;document.getElementById('success').hidden=false;}else{document.getElementById('cardError').textContent='Check your hold in Mercatus before trying again.';button.hidden=true;}return;}throw new Error('Open card entry from Mercatus.');}catch(e){document.getElementById('cardError').textContent=e.message}finally{button.disabled=false}};
</script></body></html>
