name: API audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  issue-1-disallowed-content:
    name: Disallowed content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run disallowed-content and audit-probe tests
        run: node --test outputs/committed-cart/issue-1-disallowed-content.test.mjs outputs/committed-cart/audit-probes.test.mjs outputs/committed-cart/gemini-search.test.mjs
